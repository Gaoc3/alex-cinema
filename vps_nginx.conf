worker_processes auto;
events { worker_connections 4096; }

http {
    include mime.types;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cinemanacache:50m max_size=5g inactive=12h use_temp_path=off;

    # Rate Limiting Zone: 15 requests per second per IP
    limit_req_zone $binary_remote_addr zone=scraper_limit:10m rate=15r/s;

    # Dynamic Host mapping for proxy redirects
    map $upstream_http_location $location_rewritten {
        ~^https://([a-zA-Z0-9_-]+)\.shabakaty\.com(.*)$   /tunnel/$1$2;
        default                                           $upstream_http_location;
    }

    server {
        listen 80 default_server;
        server_tokens off; # Disable version leakage

        # Apply Rate Limiting to all requests
        limit_req zone=scraper_limit burst=50 nodelay;

        # User-Agent Blocking for common scraper libraries
        if ($http_user_agent ~* (curl|wget|python|scrapy|urllib|golang|http-client|php|perl)) {
            return 403;
        }

        # Frontend Next.js
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 1. Video Streaming (No Caching, No Buffering, Direct 206 Range Passthrough)
        location ~ ^/tunnel/([a-zA-Z0-9_-]+)/(.*\.(mp4|m3u8|ts))$ {
            internal;
            set $tunnel_subdomain $1;
            set $tunnel_path $2;

            proxy_pass https://127.0.0.1:443/$tunnel_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host "$tunnel_subdomain.shabakaty.com";
            proxy_set_header Referer "https://cinemana.shabakaty.com/";
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header Bypass-Tunnel-Reminder "true";
            proxy_ssl_server_name on;
            proxy_ssl_name "$tunnel_subdomain.shabakaty.com";
            proxy_ssl_verify off;
            
            # CRITICAL: Disable buffering and caching for video streaming range requests
            proxy_buffering off;
            proxy_cache off;
            
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            
            proxy_redirect ~^https://([a-zA-Z0-9_-]+)\.shabakaty\.com(.*)$ /tunnel/$1$2;
        }

        # 2. Images & Other Media Files (Cached, Buffered for performance)
        location ~ ^/tunnel/([a-zA-Z0-9_-]+)/(.*)$ {
            internal;
            set $tunnel_subdomain $1;
            set $tunnel_path $2;

            proxy_pass https://127.0.0.1:443/$tunnel_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host "$tunnel_subdomain.shabakaty.com";
            proxy_set_header Referer "https://cinemana.shabakaty.com/";
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header Bypass-Tunnel-Reminder "true";
            proxy_ssl_server_name on;
            proxy_ssl_name "$tunnel_subdomain.shabakaty.com";
            proxy_ssl_verify off;
            
            # Enable caching and buffering for images/static files
            proxy_buffering on;
            proxy_cache cinemanacache;
            proxy_cache_valid 200 302 12h;
            
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=2592000" always;
            
            proxy_redirect ~^https://([a-zA-Z0-9_-]+)\.shabakaty\.com(.*)$ /tunnel/$1$2;
        }
    }
}
