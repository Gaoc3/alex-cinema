worker_processes auto;
events { worker_connections 4096; }

http {
    include mime.types;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cinemanacache:50m max_size=5g inactive=12h use_temp_path=off;

    limit_req_zone $http_cf_connecting_ip zone=scraper_limit:10m rate=15r/s;

    map $upstream_http_location $location_rewritten {
        ~^https://([a-zA-Z0-9_-]+)\.shabakaty\.com(.*)$    /tunnel/$1$2;
        default                                             $upstream_http_location;
    }

    # Upstream with persistent keep-alive connections to router tunnel
    upstream shabakaty_tunnel {
        server 127.0.0.1:8443;
        keepalive 64;
    }

    # 1. Shabakaty Router Tunnel Block (Handles all *.shabakaty.com requests from Node.js)
    server {
        listen 80;
        listen 443 ssl;
        server_name *.shabakaty.com shabakaty.com;

        ssl_certificate /etc/nginx/ssl/origin.pem;
        ssl_certificate_key /etc/nginx/ssl/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass https://shabakaty_tunnel;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_ssl_name $host;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header Referer "https://cinemana.shabakaty.com/";
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header Bypass-Tunnel-Reminder "true";
        }
    }

    # 2. Main Public Website Block for cinax.live & www.cinax.live
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name cinax.live www.cinax.live;
        server_tokens off;

        ssl_certificate /etc/nginx/ssl/origin.pem;
        ssl_certificate_key /etc/nginx/ssl/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        limit_req zone=scraper_limit burst=300 nodelay;

        if ($http_user_agent ~* (curl|wget|python|scrapy|urllib|golang|php|perl)) {
            return 403;
        }

        location /socket.io/ {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location @handle_redirect {
            resolver 127.0.0.53 ipv6=off;
            set $saved_redirect_location '$upstream_http_location';
            
            if ($saved_redirect_location ~* ^https?://([^/]+)) {
                set $redirect_host $1;
            }
            
            proxy_pass $saved_redirect_location;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_ssl_name $redirect_host;
            proxy_set_header Host $redirect_host;
            proxy_set_header Bypass-Tunnel-Reminder "true";
            proxy_set_header Referer "https://cinemana.shabakaty.com/";
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        }

        location ~ ^/tunnel/([a-zA-Z0-9_-]+)/(.*\.(mp4|m3u8|ts))$ {
            proxy_intercept_errors on;
            error_page 301 302 307 308 = @handle_redirect;
            
            set $tunnel_subdomain $1;
            set $tunnel_path $2;

            proxy_pass https://shabakaty_tunnel/$tunnel_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "$tunnel_subdomain.shabakaty.com";
            proxy_set_header Referer "https://cinemana.shabakaty.com/";
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header Bypass-Tunnel-Reminder "true";
            proxy_ssl_server_name on;
            proxy_ssl_name "$tunnel_subdomain.shabakaty.com";
            proxy_ssl_verify off;

            proxy_buffering off;
            proxy_cache off;

            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;

            proxy_redirect ~^https://([a-zA-Z0-9_-]+)\.shabakaty\.com(.*)$ /tunnel/$1$2;
        }

        location ~ ^/tunnel/([a-zA-Z0-9_-]+)/(.*)$ {
            proxy_intercept_errors on;
            error_page 301 302 307 308 = @handle_redirect;
            
            set $tunnel_subdomain $1;
            set $tunnel_path $2;

            proxy_pass https://shabakaty_tunnel/$tunnel_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "$tunnel_subdomain.shabakaty.com";
            proxy_set_header Referer "https://cinemana.shabakaty.com/";
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header Bypass-Tunnel-Reminder "true";
            proxy_ssl_server_name on;
            proxy_ssl_name "$tunnel_subdomain.shabakaty.com";
            proxy_ssl_verify off;

            proxy_buffering on;
            proxy_cache cinemanacache;
            proxy_cache_valid 200 302 12h;

            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=2592000" always;

            proxy_redirect ~^https://([a-zA-Z0-9_-]+)\.shabakaty\.com(.*)$ /tunnel/$1$2;
        }
    }
}
