global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 8s
    timeout client 2m
    timeout server 2m

resolvers earthlink_dns
    parse-resolv-conf
    timeout resolve 3s
    timeout retry 1s
    hold valid 30s
    hold nx 5s
    hold other 5s

frontend shabakaty_sni
    bind 0.0.0.0:8443
    tcp-request inspect-delay 5s
    tcp-request content reject unless { req.ssl_hello_type 1 }
    tcp-request content reject unless { req.ssl_sni -m end -i .shabakaty.com }
    tcp-request content do-resolve(txn.upstream_ip,earthlink_dns,ipv4) req.ssl_sni,lower
    tcp-request content reject unless { var(txn.upstream_ip) -m found }
    tcp-request content set-dst var(txn.upstream_ip)
    default_backend dynamic_shabakaty

backend dynamic_shabakaty
    server upstream 0.0.0.0:443

